[build]
base = "frontend"
command = "npm install && npm run build"
publish = ".next"

[build.environment]
NODE_VERSION = "20"
NEXT_PUBLIC_API_URL = "https://google-my-businsess-optimizer-git-923496400126.asia-south1.run.app"

[[redirects]]
from = "/api/*"
to = "https://google-my-businsess-optimizer-git-923496400126.asia-south1.run.app/api/:splat"
status = 200
force = true

[[redirects]]
from = "/oauth2/*"
to = "https://google-my-businsess-optimizer-git-923496400126.asia-south1.run.app/oauth2/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
